name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test every tool
        run: |
          pip install pytest
          for d in tools/*/; do
            echo "== $d"; (cd "$d" && python -m pytest -q)
          done
